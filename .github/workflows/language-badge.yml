name: Language badge

# Recomputes the JavaScript share of the repository from GitHub's own Linguist
# stats (which already honour .gitattributes vendoring/generation rules) and
# publishes it as a shields.io "endpoint" badge on the dedicated, unprotected
# `badges` branch — so it never pushes to the protected default branch.

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    # Weekly refresh in case language stats drift without a push.
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: language-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Update JavaScript badge
    runs-on: ubuntu-latest
    steps:
      - name: Compute and publish badge
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'badges';
            const path = 'javascript.json';

            // 1. Compute the JavaScript share from GitHub's Linguist stats.
            const { data: langs } = await github.rest.repos.listLanguages({ owner, repo });
            const total = Object.values(langs).reduce((sum, n) => sum + n, 0);
            const pct = total ? ((langs.JavaScript || 0) / total) * 100 : 0;
            const badge = {
              schemaVersion: 1,
              label: 'JavaScript',
              message: `${pct.toFixed(1)}%`,
              color: 'F7DF1E',
              namedLogo: 'javascript',
              logoColor: 'black'
            };
            const content = JSON.stringify(badge, null, 2) + '\n';

            // 2. Find the current head of the (unprotected) badges branch.
            let parentSha;
            try {
              const { data: ref } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
              parentSha = ref.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // 3. Skip when the published badge is already identical.
            if (parentSha) {
              try {
                const { data: existing } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path,
                  ref: branch
                });
                const current = Buffer.from(existing.content, 'base64').toString('utf8');
                if (current === content) {
                  core.info(`JavaScript badge already up to date (${badge.message}).`);
                  return;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            // 4. Build a tree that contains only the badge file.
            const { data: blob } = await github.rest.git.createBlob({
              owner,
              repo,
              content,
              encoding: 'utf-8'
            });
            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              tree: [{ path, mode: '100644', type: 'blob', sha: blob.sha }]
            });

            // 5. Commit to the badges branch (orphan commit when it is new),
            //    never touching the protected default branch.
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'chore: update JavaScript language badge [skip ci]',
              tree: tree.sha,
              parents: parentSha ? [parentSha] : []
            });
            if (parentSha) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `heads/${branch}`,
                sha: commit.sha
              });
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: commit.sha
              });
            }
            core.info(`JavaScript badge published: ${badge.message}`);
